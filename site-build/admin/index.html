<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANPAR Admin - Product Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }
    .header {
      background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 1.5rem; }
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }

    .login-box {
      max-width: 400px;
      margin: 4rem auto;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .login-box h2 { margin-bottom: 1.5rem; text-align: center; }
    .login-box input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
    }
    .login-box button {
      width: 100%;
      padding: 0.75rem;
      background: #2c5282;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    .login-box button:hover { background: #1a365d; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-primary { background: #2c5282; color: white; }
    .btn-primary:hover { background: #1a365d; }
    .btn-success { background: #38a169; color: white; }
    .btn-success:hover { background: #2f855a; }
    .btn-danger { background: #e53e3e; color: white; }
    .btn-danger:hover { background: #c53030; }
    .btn-secondary { background: #718096; color: white; }
    .btn-secondary:hover { background: #4a5568; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .product-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .product-card:hover { transform: translateY(-2px); }
    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #f0f0f0;
    }
    .product-card-body { padding: 1rem; }
    .product-card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .product-card .category {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      background: #e2e8f0;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .product-card p {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 1rem;
    }
    .product-card-actions {
      display: flex;
      gap: 0.5rem;
    }
    .product-card .status {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .product-card .status.active { background: #c6f6d5; color: #22543d; }
    .product-card .status.inactive { background: #fed7d7; color: #822727; }
    .product-card-header { position: relative; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    #categoryModal { z-index: 1100; }
    .modal-content {
      background: white;
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h2 { font-size: 1.25rem; }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
    }
    .modal-body { padding: 1.5rem; }
    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
    }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .form-group small { color: #666; font-size: 0.8rem; }

    .features-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .feature-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.5rem;
      background: #e2e8f0;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .feature-tag button {
      background: none;
      border: none;
      margin-left: 0.5rem;
      cursor: pointer;
      color: #e53e3e;
    }
    .add-feature {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .add-feature input { flex: 1; }

    .category-input-group {
      display: flex;
      gap: 0.5rem;
    }
    .category-input-group select { flex: 1; }

    .modal-small { max-width: 400px; }

    .image-upload-area {
      border: 2px dashed #ddd;
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafafa;
    }
    .image-upload-area:hover {
      border-color: #2c5282;
      background: #f0f4f8;
    }
    .image-upload-area.dragover {
      border-color: #38a169;
      background: #f0fff4;
    }
    .image-upload-area input[type="file"] {
      display: none;
    }
    .image-upload-area .upload-icon {
      font-size: 2rem;
      color: #718096;
      margin-bottom: 0.5rem;
    }
    .image-upload-area p {
      margin: 0;
      color: #718096;
      font-size: 0.9rem;
    }
    .image-preview {
      margin-top: 1rem;
      position: relative;
      display: inline-block;
    }
    .image-preview img {
      max-width: 200px;
      max-height: 150px;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    .image-preview .remove-image {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #e53e3e;
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .checkbox-group input { width: auto; }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      border-radius: 4px;
      color: white;
      font-weight: 500;
      z-index: 2000;
      animation: slideIn 0.3s ease;
    }
    .toast.success { background: #38a169; }
    .toast.error { background: #e53e3e; }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .hidden { display: none !important; }
    .loading { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <!-- Admin Panel (protected by nginx basic auth) -->
  <div id="adminPanel">
    <div class="header">
      <h1>SANPAR Product Manager</h1>
      <button class="btn btn-secondary" onclick="logout()">Logout</button>
    </div>
    <div class="container">
      <div class="toolbar">
        <div>
          <button class="btn btn-primary" onclick="openModal()">+ Add Product</button>
          <button class="btn btn-success" onclick="saveToS3()">Save Changes</button>
        </div>
        <div>
          <select id="categoryFilter" onchange="filterProducts()">
            <option value="">All Categories</option>
          </select>
        </div>
      </div>
      <div id="productGrid" class="product-grid"></div>
    </div>
  </div>

  <!-- Category Modal -->
  <div id="categoryModal" class="modal">
    <div class="modal-content modal-small">
      <div class="modal-header">
        <h2>Add New Category</h2>
        <button class="modal-close" onclick="closeCategoryModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Category Name *</label>
          <input type="text" id="newCategoryName" placeholder="e.g., Heat Exchangers">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeCategoryModal()">Cancel</button>
        <button class="btn btn-primary" onclick="addCategory()">Add Category</button>
      </div>
    </div>
  </div>

  <!-- Product Modal -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add Product</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="productId">
        <div class="form-group">
          <label>Product Name *</label>
          <input type="text" id="productName" required>
        </div>
        <div class="form-group">
          <label>URL Slug *</label>
          <input type="text" id="productSlug" placeholder="e.g., water-chillers">
          <small>Used in the URL: sanpar.com/product-[slug]</small>
        </div>
        <div class="form-group">
          <label>Category *</label>
          <div class="category-input-group">
            <select id="productCategory">
              <option value="Chillers">Chillers</option>
              <option value="Dryers">Dryers</option>
              <option value="Medical & Dental">Medical & Dental</option>
              <option value="Accessories">Accessories</option>
              <option value="Climate Control">Climate Control</option>
            </select>
            <button type="button" class="btn btn-secondary" onclick="openCategoryModal()">+ New</button>
          </div>
        </div>
        <div class="form-group">
          <label>Description *</label>
          <textarea id="productDescription"></textarea>
        </div>
        <div class="form-group">
          <label>Product Image</label>
          <div class="image-upload-area" id="imageUploadArea" onclick="document.getElementById('imageFile').click()">
            <input type="file" id="imageFile" accept="image/*" onchange="handleImageUpload(this)">
            <div class="upload-icon">📷</div>
            <p>Click to upload or drag & drop</p>
            <p><small>PNG, JPG, WebP (max 5MB)</small></p>
          </div>
          <div id="imagePreview" class="image-preview hidden">
            <img id="previewImg" alt="Preview">
            <button type="button" class="remove-image" onclick="removeImage()">×</button>
          </div>
          <input type="hidden" id="productImage">
          <small id="imageStatus"></small>
        </div>
        <div class="form-group">
          <label>Features</label>
          <div id="featuresList" class="features-list"></div>
          <div class="add-feature">
            <input type="text" id="newFeature" placeholder="Add a feature">
            <button class="btn btn-primary" onclick="addFeature()">Add</button>
          </div>
        </div>
        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="productActive" checked>
            <label for="productActive">Active (visible on website)</label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveProduct()">Save Product</button>
      </div>
    </div>
  </div>

  <script>
    // Configuration — same-origin endpoints served by the local CMS backend.
    // Reads come from the static file (fast, cacheable). Writes go to the API.
    const READ_URL  = '/data/products.json';
    const SAVE_URL  = '/admin/api/save';

    let products = [];
    let editingIndex = -1;
    let currentFeatures = [];
    let currentImageFile = null;
    let currentImageDataUrl = null;  // base64 data URL of the new image (sent to backend on save)
    let uploadedImages = [];

    // Session timeout (30 minutes of inactivity)
    const SESSION_TIMEOUT = 30 * 60 * 1000;
    let sessionTimer;

    function resetSessionTimer() {
      clearTimeout(sessionTimer);
      sessionTimer = setTimeout(() => {
        showToast('Session expired. Redirecting...', 'error');
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      }, SESSION_TIMEOUT);
    }

    // Track user activity
    ['click', 'keypress', 'mousemove', 'scroll'].forEach(event => {
      document.addEventListener(event, resetSessionTimer);
    });

    // XSS Prevention - sanitize HTML
    function sanitizeHTML(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Validate and sanitize input
    function sanitizeInput(str) {
      if (!str) return '';
      return str.replace(/[<>\"'&]/g, char => ({
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#x27;',
        '&': '&amp;'
      }[char]));
    }

    function logout() {
      // Redirect to home - nginx will require re-authentication
      window.location.href = '/';
    }

    // Load products from same-origin JSON. Cache-bust each load.
    async function loadProducts() {
      try {
        const response = await fetch(READ_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        products = data.products || [];
        updateCategoryFilter();
        renderProducts();
      } catch (error) {
        console.error('Error loading products:', error);
        showToast('Error loading products: ' + error.message, 'error');
      }
    }

    // Render products grid
    function renderProducts(filteredProducts = null) {
      const grid = document.getElementById('productGrid');
      const displayProducts = filteredProducts || products;

      grid.innerHTML = displayProducts.map((product, index) => `
        <div class="product-card">
          <div class="product-card-header">
            <img src="/${sanitizeHTML(product.image).replace(/^\//, '')}" alt="${sanitizeHTML(product.name)}" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22300%22%20height=%22180%22%3E%3Crect%20width=%22300%22%20height=%22180%22%20fill=%22%23eef0f3%22/%3E%3Ctext%20x=%22150%22%20y=%2297%22%20font-family=%22sans-serif%22%20font-size=%2214%22%20fill=%22%23949ba6%22%20text-anchor=%22middle%22%3ENo%20Image%3C/text%3E%3C/svg%3E'">
            <span class="status ${product.active ? 'active' : 'inactive'}">${product.active ? 'Active' : 'Inactive'}</span>
          </div>
          <div class="product-card-body">
            <span class="category">${sanitizeHTML(product.category)}</span>
            <h3>${sanitizeHTML(product.name)}</h3>
            <p>${sanitizeHTML(product.description.substring(0, 100))}${product.description.length > 100 ? '...' : ''}</p>
            <div class="product-card-actions">
              <button class="btn btn-primary" onclick="editProduct(${products.indexOf(product)})">Edit</button>
              <button class="btn btn-danger" onclick="deleteProduct(${products.indexOf(product)})">Delete</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Category filter
    function updateCategoryFilter() {
      const categories = [...new Set(products.map(p => p.category))];
      const select = document.getElementById('categoryFilter');
      select.innerHTML = '<option value="">All Categories</option>' +
        categories.map(c => `<option value="${sanitizeHTML(c)}">${sanitizeHTML(c)}</option>`).join('');
    }

    function filterProducts() {
      const category = document.getElementById('categoryFilter').value;
      if (category) {
        renderProducts(products.filter(p => p.category === category));
      } else {
        renderProducts();
      }
    }

    // Modal functions
    function openModal(index = -1) {
      editingIndex = index;
      const modal = document.getElementById('productModal');

      // Reset image state
      currentImageFile = null;
      document.getElementById('imageFile').value = '';
      document.getElementById('imageStatus').textContent = '';

      // Always start with a clean new-image slot
      currentImageDataUrl = null;

      if (index >= 0) {
        const product = products[index];
        document.getElementById('modalTitle').textContent = 'Edit Product';
        document.getElementById('productId').value = product.id;
        document.getElementById('productName').value = product.name;
        document.getElementById('productSlug').value = product.id;
        document.getElementById('productCategory').value = product.category;
        document.getElementById('productDescription').value = product.description;
        document.getElementById('productImage').value = product.image;
        document.getElementById('productActive').checked = product.active;
        currentFeatures = [...(product.features || [])];

        // Show existing image — same-origin path so it works on any host
        if (product.image) {
          document.getElementById('previewImg').src = '/' + product.image;
          document.getElementById('imagePreview').classList.remove('hidden');
          document.getElementById('imageUploadArea').classList.add('hidden');
          document.getElementById('imageStatus').textContent = 'Current image (upload new to replace)';
        } else {
          document.getElementById('imagePreview').classList.add('hidden');
          document.getElementById('imageUploadArea').classList.remove('hidden');
        }
      } else {
        document.getElementById('modalTitle').textContent = 'Add Product';
        document.getElementById('productId').value = '';
        document.getElementById('productName').value = '';
        document.getElementById('productSlug').value = '';
        document.getElementById('productCategory').value = 'Chillers';
        document.getElementById('productDescription').value = '';
        document.getElementById('productImage').value = '';
        document.getElementById('productActive').checked = true;
        currentFeatures = [];

        // Reset image UI
        document.getElementById('imagePreview').classList.add('hidden');
        document.getElementById('imageUploadArea').classList.remove('hidden');
      }

      renderFeatures();
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('productModal').classList.remove('active');
      editingIndex = -1;
      currentFeatures = [];
    }

    // Features management
    function renderFeatures() {
      const container = document.getElementById('featuresList');
      container.innerHTML = currentFeatures.map((feature, i) => `
        <span class="feature-tag">
          ${sanitizeHTML(feature)}
          <button onclick="removeFeature(${i})">&times;</button>
        </span>
      `).join('');
    }

    function addFeature() {
      const input = document.getElementById('newFeature');
      if (input.value.trim()) {
        currentFeatures.push(input.value.trim());
        input.value = '';
        renderFeatures();
      }
    }

    function removeFeature(index) {
      currentFeatures.splice(index, 1);
      renderFeatures();
    }

    // Save product
    function saveProduct() {
      const name = document.getElementById('productName').value.trim();
      const slug = document.getElementById('productSlug').value.trim() || name.toLowerCase().replace(/\s+/g, '-');
      const category = document.getElementById('productCategory').value;
      const description = document.getElementById('productDescription').value.trim();
      let image = document.getElementById('productImage').value.trim();
      const active = document.getElementById('productActive').checked;

      if (!name || !description) {
        showToast('Please fill in required fields', 'error');
        return;
      }

      // If a new image was picked, embed its data URL in the product.
      // The backend will detect data URLs on save, decode them, and write to disk.
      if (currentImageDataUrl) {
        image = currentImageDataUrl;
      }

      const product = {
        id: slug,
        name,
        category,
        description,
        image: image || '',
        features: currentFeatures,
        active
      };

      // Preserve existing 'url' field if editing (so the product page link stays correct)
      if (editingIndex >= 0 && products[editingIndex] && products[editingIndex].url) {
        product.url = products[editingIndex].url;
      }

      if (editingIndex >= 0) {
        products[editingIndex] = product;
      } else {
        products.push(product);
      }

      // Reset image state
      currentImageDataUrl = null;
      currentImageFile = null;

      closeModal();
      updateCategoryFilter();
      renderProducts();
      showToast('Product staged. Click "Save Changes" to publish.', 'success');
    }

    // Delete product
    function deleteProduct(index) {
      if (confirm('Are you sure you want to delete this product?')) {
        products.splice(index, 1);
        updateCategoryFilter();
        renderProducts();
        showToast('Product deleted. Click "Save Changes" to upload.', 'success');
      }
    }

    // Edit product
    function editProduct(index) {
      openModal(index);
    }

    // Publish all changes to the backend.
    // - Image data URLs travel inside the JSON payload (backend decodes & saves to disk).
    // - On success, the website's /data/products.json is updated and visible immediately.
    async function saveToS3() {
      const saveBtn = document.querySelector('button.btn-success');
      const originalLabel = saveBtn ? saveBtn.textContent : null;
      if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving...'; }

      const data = {
        lastUpdated: new Date().toISOString(),
        products: products
      };

      try {
        const response = await fetch(SAVE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'same-origin'
        });

        if (!response.ok) {
          let detail = '';
          try { detail = (await response.json()).error || ''; } catch {}
          throw new Error(`HTTP ${response.status}${detail ? ' — ' + detail : ''}`);
        }

        const result = await response.json();
        showToast(`Saved! ${result.productCount} products published.`, 'success');

        // Reload from the now-updated source so we drop any local data URLs
        // and the image paths reflect what the server wrote to disk.
        await loadProducts();
      } catch (err) {
        console.error('Save failed:', err);
        showToast('Save failed: ' + err.message, 'error');
      } finally {
        if (saveBtn) { saveBtn.disabled = false; if (originalLabel) saveBtn.textContent = originalLabel; }
      }
    }

    // Toast notifications
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message; // textContent is safe from XSS
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // Category management
    let customCategories = [];

    function openCategoryModal() {
      document.getElementById('newCategoryName').value = '';
      document.getElementById('categoryModal').classList.add('active');
    }

    function closeCategoryModal() {
      document.getElementById('categoryModal').classList.remove('active');
    }

    function addCategory() {
      const name = document.getElementById('newCategoryName').value.trim();
      if (!name) {
        showToast('Please enter a category name', 'error');
        return;
      }

      const select = document.getElementById('productCategory');

      // Check if category already exists
      const exists = Array.from(select.options).some(opt => opt.value.toLowerCase() === name.toLowerCase());
      if (exists) {
        showToast('Category already exists', 'error');
        return;
      }

      // Add new option and select it
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
      select.value = name;

      customCategories.push(name);
      closeCategoryModal();
      showToast('Category added: ' + name, 'success');
    }

    // Auto-generate slug from name
    document.getElementById('productName').addEventListener('input', function() {
      const slug = document.getElementById('productSlug');
      if (!slug.value || editingIndex < 0) {
        slug.value = this.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
      }
    });

    // Image upload handling
    function handleImageUpload(input) {
      const file = input.files[0];
      if (!file) return;

      // Validate file size (5MB max)
      if (file.size > 5 * 1024 * 1024) {
        showToast('Image must be less than 5MB', 'error');
        return;
      }

      // Validate file type
      if (!file.type.startsWith('image/')) {
        showToast('Please upload an image file', 'error');
        return;
      }

      currentImageFile = file;

      // Read as data URL — used both for preview and as the payload sent to the backend.
      const reader = new FileReader();
      reader.onload = function(e) {
        currentImageDataUrl = e.target.result;
        document.getElementById('previewImg').src = e.target.result;
        document.getElementById('imagePreview').classList.remove('hidden');
        document.getElementById('imageUploadArea').classList.add('hidden');
        document.getElementById('imageStatus').textContent = 'Image ready (will upload on Save Changes)';
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      currentImageFile = null;
      currentImageDataUrl = null;
      document.getElementById('imageFile').value = '';
      document.getElementById('productImage').value = '';
      document.getElementById('imagePreview').classList.add('hidden');
      document.getElementById('imageUploadArea').classList.remove('hidden');
      document.getElementById('imageStatus').textContent = '';
    }

    // Drag and drop handling
    const uploadArea = document.getElementById('imageUploadArea');
    if (uploadArea) {
      uploadArea.addEventListener('dragover', function(e) {
        e.preventDefault();
        this.classList.add('dragover');
      });

      uploadArea.addEventListener('dragleave', function(e) {
        e.preventDefault();
        this.classList.remove('dragover');
      });

      uploadArea.addEventListener('drop', function(e) {
        e.preventDefault();
        this.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) {
          document.getElementById('imageFile').files = e.dataTransfer.files;
          handleImageUpload(document.getElementById('imageFile'));
        }
      });
    }

    // Generate unique filename
    function generateImageFilename(originalName, productSlug) {
      const ext = originalName.split('.').pop().toLowerCase();
      const timestamp = Date.now();
      return `images/products/${productSlug}-${timestamp}.${ext}`;
    }

    // Store image for later upload
    function storeImageForUpload(file, filename) {
      uploadedImages.push({ file, filename });
      return filename;
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', function() {
      resetSessionTimer();
      loadProducts();
    });
  </script>
</body>
</html>
