name: Deploy to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "site-build/*"
          target: "/tmp/sanpar-deploy"
          strip_components: 1

      - name: Activate deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # --- Preserve runtime-only content across deploys ---
            # Two things are pure runtime state and NOT in git, so they must
            # survive a deploy:
            #   - images/products-cms/  : images uploaded via the admin UI
            #   - data/backups/         : timestamped products.json backups the
            #                             CMS writes on every Save
            # data/products.json IS tracked in git and is the source of truth,
            # so it is deployed fresh from the repo each time. (Admin edits made
            # in the CMS should be committed back to git to persist.)
            sudo rm -rf /tmp/sanpar-preserve
            sudo mkdir -p /tmp/sanpar-preserve
            if [ -d /var/www/html/data/backups ]; then
              sudo cp -r /var/www/html/data/backups /tmp/sanpar-preserve/backups
            fi
            if [ -d /var/www/html/images/products-cms ]; then
              sudo cp -r /var/www/html/images/products-cms /tmp/sanpar-preserve/products-cms
            fi

            # Standard deploy: wipe and replace site files
            sudo rm -rf /var/www/html/*
            sudo cp -r /tmp/sanpar-deploy/* /var/www/html/

            # Restore runtime-only content into the freshly deployed tree.
            # products.json is intentionally NOT restored — the repo version wins.
            if [ -d /tmp/sanpar-preserve/backups ]; then
              sudo mkdir -p /var/www/html/data
              sudo cp -r /tmp/sanpar-preserve/backups /var/www/html/data/backups
            fi
            if [ -d /tmp/sanpar-preserve/products-cms ]; then
              sudo mkdir -p /var/www/html/images/products-cms
              sudo cp -rn /tmp/sanpar-preserve/products-cms/. /var/www/html/images/products-cms/ 2>/dev/null || true
            fi
            sudo rm -rf /tmp/sanpar-preserve

            # Strip dev-only artifacts that should not be web-accessible
            sudo find /var/www/html -maxdepth 2 -type f \( \
                -name '*.py' -o \
                -name 'CLAUDE.md' -o \
                -name 'PLAN.md' -o \
                -name 'MISSING-CONTENT.md' \
              \) -delete 2>/dev/null || true
            sudo chown -R www-data:www-data /var/www/html
            rm -rf /tmp/sanpar-deploy

      - name: Configure nginx for SPA routing
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e

            # Clean up any stray .bak files left in sites-enabled by previous runs.
            # nginx loads every file in sites-enabled/ — backup files cause
            # "duplicate default server" errors.
            sudo find /etc/nginx/sites-enabled/ -maxdepth 1 -name '*.bak*' -delete 2>/dev/null || true

            BACKUP_DIR=/var/backups/nginx
            sudo mkdir -p "$BACKUP_DIR"

            CONF=$(sudo grep -l "/var/www/html" /etc/nginx/sites-enabled/* 2>/dev/null | grep -v '\.bak' | head -1)
            if [ -z "$CONF" ]; then
              CONF=$(sudo grep -l "sanpar" /etc/nginx/sites-enabled/* 2>/dev/null | grep -v '\.bak' | head -1)
            fi
            if [ -z "$CONF" ]; then
              CONF=/etc/nginx/sites-enabled/default
            fi
            echo "Using nginx config: $CONF"

            if sudo grep -qE 'try_files[^;]*\$uri\.html' "$CONF"; then
              echo "nginx already configured for SPA routing — skipping"
              # Still reload in case stray bak cleanup above changed things
              sudo nginx -t && sudo systemctl reload nginx
              exit 0
            fi

            BACKUP_FILE="$BACKUP_DIR/$(basename "$CONF").bak-$(date +%Y%m%d-%H%M%S)"
            sudo cp "$CONF" "$BACKUP_FILE"
            echo "Backed up to $BACKUP_FILE"

            if sudo grep -qE 'try_files[[:space:]]+\$uri' "$CONF"; then
              sudo sed -i -E 's|try_files[[:space:]]+\$uri[^;]+;|try_files $uri $uri.html $uri/ /index.html;|' "$CONF"
              echo "Updated existing try_files directive"
            else
              echo "ERROR: no try_files directive found in $CONF — manual nginx update required"
              exit 1
            fi

            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "nginx reloaded successfully"
            else
              sudo cp "$BACKUP_FILE" "$CONF"
              echo "nginx test failed — config reverted from $BACKUP_FILE"
              sudo nginx -t && sudo systemctl reload nginx
              exit 1
            fi

      - name: Apply nginx security headers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            BACKUP_DIR=/var/backups/nginx
            sudo mkdir -p "$BACKUP_DIR" /etc/nginx/snippets

            # Always write the latest snippet (idempotent — overwrite is safe)
            sudo tee /etc/nginx/snippets/sanpar-security.conf > /dev/null <<'EOF'
            # Security headers for SANPAR (managed by deploy workflow)
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            EOF

            # Find the active sanpar config (skip .bak files)
            CONF=$(sudo grep -l "/var/www/html" /etc/nginx/sites-enabled/* 2>/dev/null | grep -v '\.bak' | head -1)
            [ -z "$CONF" ] && CONF=$(sudo grep -l "sanpar" /etc/nginx/sites-enabled/* 2>/dev/null | grep -v '\.bak' | head -1)
            [ -z "$CONF" ] && CONF=/etc/nginx/sites-enabled/default

            if sudo grep -q "snippets/sanpar-security.conf" "$CONF"; then
              echo "Security headers include already present — reloading to pick up snippet changes"
              sudo nginx -t && sudo systemctl reload nginx
              exit 0
            fi

            BACKUP_FILE="$BACKUP_DIR/$(basename "$CONF").bak-secheaders-$(date +%Y%m%d-%H%M%S)"
            sudo cp "$CONF" "$BACKUP_FILE"

            # Insert include directive after the FIRST server_name line (one-shot)
            sudo awk '
              !done && /^[[:space:]]*server_name/ {
                print
                print "        include /etc/nginx/snippets/sanpar-security.conf;"
                done = 1
                next
              }
              { print }
            ' "$BACKUP_FILE" | sudo tee "$CONF" > /dev/null

            if ! sudo grep -q "snippets/sanpar-security.conf" "$CONF"; then
              echo "WARNING: server_name not found — falling back to insert after first listen"
              sudo awk '
                !done && /^[[:space:]]*listen/ {
                  print
                  print "        include /etc/nginx/snippets/sanpar-security.conf;"
                  done = 1
                  next
                }
                { print }
              ' "$BACKUP_FILE" | sudo tee "$CONF" > /dev/null
            fi

            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "Security headers applied and nginx reloaded"
            else
              sudo cp "$BACKUP_FILE" "$CONF"
              echo "ERROR: nginx test failed — config reverted from $BACKUP_FILE"
              sudo nginx -t && sudo systemctl reload nginx
              exit 1
            fi

      - name: Ensure CMS API reverse-proxy (/admin/api/)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            BACKUP_DIR=/var/backups/nginx
            sudo mkdir -p "$BACKUP_DIR"

            # Find the active sanpar config (skip .bak files)
            CONF=$(sudo grep -l "/var/www/html" /etc/nginx/sites-enabled/* 2>/dev/null | grep -v '\.bak' | head -1)
            [ -z "$CONF" ] && CONF=$(sudo grep -l "sanpar" /etc/nginx/sites-enabled/* 2>/dev/null | grep -v '\.bak' | head -1)
            [ -z "$CONF" ] && CONF=/etc/nginx/sites-enabled/default
            echo "Using nginx config: $CONF"

            # Idempotent — skip if the CMS API proxy block is already present
            if sudo grep -q "location /admin/api/" "$CONF"; then
              echo "CMS API proxy block already present — skipping"
              sudo nginx -t && sudo systemctl reload nginx
              exit 0
            fi

            BACKUP_FILE="$BACKUP_DIR/$(basename "$CONF").bak-cmsapi-$(date +%Y%m%d-%H%M%S)"
            sudo cp "$CONF" "$BACKUP_FILE"
            echo "Backed up to $BACKUP_FILE"

            # The reverse-proxy block: routes /admin/api/* to the local Node CMS
            BLOCK='    # SANPAR CMS API - reverse-proxy to local Node.js service\n    location /admin/api/ {\n        auth_basic "SANPAR Admin";\n        auth_basic_user_file /etc/nginx/.htpasswd;\n        proxy_pass http://127.0.0.1:3001/;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        client_max_body_size 60M;\n        proxy_read_timeout 60s;\n    }\n'

            # Insert before the first "location /admin" block; fall back to
            # inserting before the server block's closing brace.
            if sudo grep -qE '^[[:space:]]*location[[:space:]]+/admin\b' "$BACKUP_FILE"; then
              sudo awk -v b="$BLOCK" '!d && /^[[:space:]]*location[[:space:]]+\/admin\b/ { printf("%s", b); d=1 } { print }' "$BACKUP_FILE" | sudo tee "$CONF" > /dev/null
            else
              sudo awk -v b="$BLOCK" 'BEGIN{d=0;depth=0} /^[[:space:]]*server[[:space:]]*\{/{s=1} s&&/\{/{depth++} s&&/\}/{depth--; if(depth==0&&!d){printf("%s",b);d=1}} {print}' "$BACKUP_FILE" | sudo tee "$CONF" > /dev/null
            fi

            if ! sudo grep -q "location /admin/api/" "$CONF"; then
              sudo cp "$BACKUP_FILE" "$CONF"
              echo "ERROR: could not insert CMS API block — reverted"
              exit 1
            fi

            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "CMS API proxy block added and nginx reloaded"
            else
              sudo cp "$BACKUP_FILE" "$CONF"
              echo "ERROR: nginx test failed — config reverted from $BACKUP_FILE"
              sudo nginx -t && sudo systemctl reload nginx
              exit 1
            fi
