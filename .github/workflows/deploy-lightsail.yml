name: Deploy to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "site-build/*"
          target: "/tmp/sanpar-deploy"
          strip_components: 1

      - name: Activate deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # --- Preserve admin-managed content across deploys ---
            # The CMS admin writes to /var/www/html/data/products.json and uploads
            # images to /var/www/html/images/products-cms/. These are NOT in git —
            # they're the runtime state edited via the admin UI. We back them up
            # before wiping the web root and restore them after the fresh deploy.
            sudo rm -rf /tmp/sanpar-preserve
            sudo mkdir -p /tmp/sanpar-preserve
            if [ -d /var/www/html/data ]; then
              sudo cp -r /var/www/html/data /tmp/sanpar-preserve/data
            fi
            if [ -d /var/www/html/images/products-cms ]; then
              sudo cp -r /var/www/html/images/products-cms /tmp/sanpar-preserve/products-cms
            fi

            # Standard deploy: wipe and replace site files
            sudo rm -rf /var/www/html/*
            sudo cp -r /tmp/sanpar-deploy/* /var/www/html/

            # Restore admin-managed content. If the server already had a data
            # directory with admin edits, those edits win over the deploy's
            # version. On a first-ever deploy (nothing to preserve), the
            # deploy's data/products.json seeds the initial state.
            if [ -d /tmp/sanpar-preserve/data ]; then
              sudo rm -rf /var/www/html/data
              sudo cp -r /tmp/sanpar-preserve/data /var/www/html/data
            fi
            if [ -d /tmp/sanpar-preserve/products-cms ]; then
              sudo mkdir -p /var/www/html/images/products-cms
              sudo cp -rn /tmp/sanpar-preserve/products-cms/. /var/www/html/images/products-cms/ 2>/dev/null || true
            fi
            sudo rm -rf /tmp/sanpar-preserve

            # Strip dev-only artifacts that should not be web-accessible
            sudo find /var/www/html -maxdepth 2 -type f \( \
                -name '*.py' -o \
                -name 'CLAUDE.md' -o \
                -name 'PLAN.md' -o \
                -name 'MISSING-CONTENT.md' \
              \) -delete 2>/dev/null || true
            sudo chown -R www-data:www-data /var/www/html
            rm -rf /tmp/sanpar-deploy

      - name: Configure nginx for SPA routing
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e

            # Clean up any stray .bak files left in sites-enabled by previous runs.
            # nginx loads every file in sites-enabled/ — backup files cause
            # "duplicate default server" errors.
            sudo find /etc/nginx/sites-enabled/ -maxdepth 1 -name '*.bak*' -delete 2>/dev/null || true

            BACKUP_DIR=/var/backups/nginx
            sudo mkdir -p "$BACKUP_DIR"

            CONF=$(sudo grep -l "/var/www/html" /etc/nginx/sites-enabled/* 2>/dev/null | grep -v '\.bak' | head -1)
            if [ -z "$CONF" ]; then
              CONF=$(sudo grep -l "sanpar" /etc/nginx/sites-enabled/* 2>/dev/null | grep -v '\.bak' | head -1)
            fi
            if [ -z "$CONF" ]; then
              CONF=/etc/nginx/sites-enabled/default
            fi
            echo "Using nginx config: $CONF"

            if sudo grep -qE 'try_files[^;]*\$uri\.html' "$CONF"; then
              echo "nginx already configured for SPA routing — skipping"
              # Still reload in case stray bak cleanup above changed things
              sudo nginx -t && sudo systemctl reload nginx
              exit 0
            fi

            BACKUP_FILE="$BACKUP_DIR/$(basename "$CONF").bak-$(date +%Y%m%d-%H%M%S)"
            sudo cp "$CONF" "$BACKUP_FILE"
            echo "Backed up to $BACKUP_FILE"

            if sudo grep -qE 'try_files[[:space:]]+\$uri' "$CONF"; then
              sudo sed -i -E 's|try_files[[:space:]]+\$uri[^;]+;|try_files $uri $uri.html $uri/ /index.html;|' "$CONF"
              echo "Updated existing try_files directive"
            else
              echo "ERROR: no try_files directive found in $CONF — manual nginx update required"
              exit 1
            fi

            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "nginx reloaded successfully"
            else
              sudo cp "$BACKUP_FILE" "$CONF"
              echo "nginx test failed — config reverted from $BACKUP_FILE"
              sudo nginx -t && sudo systemctl reload nginx
              exit 1
            fi

      - name: Apply nginx security headers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            BACKUP_DIR=/var/backups/nginx
            sudo mkdir -p "$BACKUP_DIR" /etc/nginx/snippets

            # Always write the latest snippet (idempotent — overwrite is safe)
            sudo tee /etc/nginx/snippets/sanpar-security.conf > /dev/null <<'EOF'
            # Security headers for SANPAR (managed by deploy workflow)
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            EOF

            # Find the active sanpar config (skip .bak files)
            CONF=$(sudo grep -l "/var/www/html" /etc/nginx/sites-enabled/* 2>/dev/null | grep -v '\.bak' | head -1)
            [ -z "$CONF" ] && CONF=$(sudo grep -l "sanpar" /etc/nginx/sites-enabled/* 2>/dev/null | grep -v '\.bak' | head -1)
            [ -z "$CONF" ] && CONF=/etc/nginx/sites-enabled/default

            if sudo grep -q "snippets/sanpar-security.conf" "$CONF"; then
              echo "Security headers include already present — reloading to pick up snippet changes"
              sudo nginx -t && sudo systemctl reload nginx
              exit 0
            fi

            BACKUP_FILE="$BACKUP_DIR/$(basename "$CONF").bak-secheaders-$(date +%Y%m%d-%H%M%S)"
            sudo cp "$CONF" "$BACKUP_FILE"

            # Insert include directive after the FIRST server_name line (one-shot)
            sudo awk '
              !done && /^[[:space:]]*server_name/ {
                print
                print "        include /etc/nginx/snippets/sanpar-security.conf;"
                done = 1
                next
              }
              { print }
            ' "$BACKUP_FILE" | sudo tee "$CONF" > /dev/null

            if ! sudo grep -q "snippets/sanpar-security.conf" "$CONF"; then
              echo "WARNING: server_name not found — falling back to insert after first listen"
              sudo awk '
                !done && /^[[:space:]]*listen/ {
                  print
                  print "        include /etc/nginx/snippets/sanpar-security.conf;"
                  done = 1
                  next
                }
                { print }
              ' "$BACKUP_FILE" | sudo tee "$CONF" > /dev/null
            fi

            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "Security headers applied and nginx reloaded"
            else
              sudo cp "$BACKUP_FILE" "$CONF"
              echo "ERROR: nginx test failed — config reverted from $BACKUP_FILE"
              sudo nginx -t && sudo systemctl reload nginx
              exit 1
            fi
