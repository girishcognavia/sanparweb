name: Deploy to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "site-build/*"
          target: "/tmp/sanpar-deploy"
          strip_components: 1

      - name: Activate deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/html/*
            sudo cp -r /tmp/sanpar-deploy/* /var/www/html/
            sudo chown -R www-data:www-data /var/www/html
            rm -rf /tmp/sanpar-deploy

      - name: Configure nginx for SPA routing
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e

            # Clean up any stray .bak files left in sites-enabled by previous runs.
            # nginx loads every file in sites-enabled/ — backup files cause
            # "duplicate default server" errors.
            sudo find /etc/nginx/sites-enabled/ -maxdepth 1 -name '*.bak*' -delete 2>/dev/null || true

            BACKUP_DIR=/var/backups/nginx
            sudo mkdir -p "$BACKUP_DIR"

            CONF=$(sudo grep -l "/var/www/html" /etc/nginx/sites-enabled/* 2>/dev/null | grep -v '\.bak' | head -1)
            if [ -z "$CONF" ]; then
              CONF=$(sudo grep -l "sanpar" /etc/nginx/sites-enabled/* 2>/dev/null | grep -v '\.bak' | head -1)
            fi
            if [ -z "$CONF" ]; then
              CONF=/etc/nginx/sites-enabled/default
            fi
            echo "Using nginx config: $CONF"

            if sudo grep -qE 'try_files[^;]*\$uri\.html' "$CONF"; then
              echo "nginx already configured for SPA routing — skipping"
              # Still reload in case stray bak cleanup above changed things
              sudo nginx -t && sudo systemctl reload nginx
              exit 0
            fi

            BACKUP_FILE="$BACKUP_DIR/$(basename "$CONF").bak-$(date +%Y%m%d-%H%M%S)"
            sudo cp "$CONF" "$BACKUP_FILE"
            echo "Backed up to $BACKUP_FILE"

            if sudo grep -qE 'try_files[[:space:]]+\$uri' "$CONF"; then
              sudo sed -i -E 's|try_files[[:space:]]+\$uri[^;]+;|try_files $uri $uri.html $uri/ /index.html;|' "$CONF"
              echo "Updated existing try_files directive"
            else
              echo "ERROR: no try_files directive found in $CONF — manual nginx update required"
              exit 1
            fi

            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "nginx reloaded successfully"
            else
              sudo cp "$BACKUP_FILE" "$CONF"
              echo "nginx test failed — config reverted from $BACKUP_FILE"
              sudo nginx -t && sudo systemctl reload nginx
              exit 1
            fi
