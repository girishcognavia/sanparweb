# Rate limiting zone - 10 requests per second per IP
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;

server {
    listen 80;
    server_name sanpar.com www.sanpar.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sanpar.com www.sanpar.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/sanpar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanpar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://sanpar-cms.s3.ap-south-1.amazonaws.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self' https://sanpar-cms.s3.ap-south-1.amazonaws.com;" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Hide nginx version
    server_tokens off;

    # General site - apply general rate limit
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        try_files $uri $uri/ =404;
    }

    # Admin panel - stricter rate limit + basic auth
    location /admin {
        limit_req zone=admin_limit burst=5 nodelay;
        auth_basic "SANPAR Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~* \.(git|env|htpasswd|htaccess)$ {
        deny all;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
